<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#51247b">
  <title>Unborn Drag Babies</title>
  <style>
    :root {
      --purple: #51247b;
      --purple-deep: #351650;
      --text: #fff;
      --muted: #e3d6ed;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--purple); }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 20px 48px;
      color: var(--text);
      background: var(--purple);
      font-family: Arial, Helvetica, sans-serif;
    }
    .site-header {
      width: min(1100px, 100%);
      margin: 0 auto 34px;
      text-align: center;
    }
    .logo {
      display: block;
      width: min(100%, 1100px);
      height: auto;
      margin: 0 auto;
    }
    main { width: min(900px, 100%); margin: 0 auto; }
    .gallery {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 54px;
      align-items: center;
      gap: clamp(8px, 2vw, 24px);
    }
    .artwork {
      width: min(100%, 620px);
      justify-self: center;
      margin: 0;
    }
   .image-frame {
  width: 100%;
  aspect-ratio: 4 / 5;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 15px;

  background: linear-gradient(135deg,
    #f8e5a7 0%, #9b6b23 10%,
    #eac66e 20%, #674318 32%,
    #d9ad51 45%, #f4dda0 55%,
    #80531b 70%, #e9c574 85%,
    #9b6b23 100%);

  border: 5px ridge #bd9140;

  box-shadow:
    inset 0 0 0 2px #f9e6a9,
    inset 0 0 0 5px #79501c,
    inset 0 0 0 8px #e9c574,
    inset 0 0 0 11px #8c5e20,
    0 6px 18px rgba(0,0,0,.5);
}

.image-frame::before {
  content: "❧";
  position: absolute;
  top: 7px;
  left: 10px;
  z-index: 2;
  color: #f6dfa0;
  font-size: 32px;
  text-shadow: 1px 2px 2px #50320e;
  pointer-events: none;
}

.image-frame::after {
  content: "❧";
  position: absolute;
  top: 7px;
  right: 10px;
  z-index: 2;
  color: #f6dfa0;
  font-size: 32px;
  transform: scaleX(-1);
  text-shadow: 1px 2px 2px #50320e;
  pointer-events: none;
}

.image-frame img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border: 3px ridge #a77a32;
}
    figcaption { padding: 15px 8px 0; text-align: center; }
    .name-plaque {
  position: absolute;
  z-index: 4;
  bottom: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: 64%;
  min-height: 38px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg,
    #f2d58b 0%, #bd8d3d 35%, #8b5d20 100%);
  border: 2px ridge #f4d994;
  outline: 1px solid #76501d;
  box-shadow: 0 3px 6px rgba(0,0,0,.65);
  border-radius: 5px;
}

.name-plaque .artwork-title {
  margin: 0;
  color: #39230e;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(10px, 1.5vw, 16px);
  line-height: 1.2;
  font-weight: bold;
  letter-spacing: .06em;
  text-align: center;
  text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(255,255,255,.35);
}
    .artwork-title {
      margin: 0;
      font-size: clamp(17px, 2.2vw, 23px);
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: .025em;
    }
    .artwork-description {
      max-width: 58ch;
      margin: 9px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      font-weight: 400;
      text-align: center;
      white-space: pre-line;
    }
    .artwork-description:empty { display: none; }
    .nav-button {
      width: 50px;
      height: 64px;
      display: grid;
      place-items: center;
      padding: 0;
      color: white;
      background: transparent;
      border: 0;
      cursor: pointer;
      border-radius: 8px;
      transition: background .18s ease, opacity .18s ease;
    }
    .nav-button:hover, .nav-button:focus-visible {
      background: rgba(255,255,255,.13);
      outline: 2px solid rgba(255,255,255,.75);
      outline-offset: 2px;
    }
    .nav-button:disabled { opacity: .28; cursor: default; }
    .nav-button svg { width: 34px; height: 34px; }
    .counter {
      margin: 18px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      letter-spacing: .12em;
    }
    .empty-state {
      width: min(620px, 100%);
      aspect-ratio: 4 / 5;
      margin: 0 auto;
      padding: 30px;
      display: grid;
      place-content: center;
      text-align: center;
      background: var(--purple-deep);
      border: 1px solid rgba(255,255,255,.25);
      color: var(--muted);
    }
    .empty-state h1 { margin: 0 0 12px; color: white; font-size: 23px; }
    .empty-state p { max-width: 340px; margin: 0; line-height: 1.6; }
    @media (max-width: 560px) {
      body { padding: 18px 12px 36px; }
      .site-header { margin-bottom: 24px; }
      .gallery { grid-template-columns: 34px minmax(0, 1fr) 34px; gap: 5px; }
      .nav-button { width: 34px; height: 54px; }
      .nav-button svg { width: 27px; height: 27px; }
      figcaption { padding-top: 12px; }
    }
[hidden] {
      display: none !important;
    }
  </style>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <header class="site-header">
    <img class="logo" src="images/logo.png" alt="Unborn Drag Babies — For all the drag queens that could been, had they not been aborted.">
  </header>

  <main>
    <section id="gallery" aria-label="Artwork gallery">
<div class="empty-state" id="emptyState" hidden>
  <div>
          <h1>The gallery is waiting.</h1>
          <p>Add your images and titles to <strong>gallery.js</strong>, then publish the changes to update this page.</p>
        </div>
      </div>

      <div class="gallery" id="galleryView" hidden>
        <button class="nav-button" id="previous" type="button" aria-label="Previous image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
               <figure class="artwork">
          <div class="image-frame">
            <img id="galleryImage" src="" alt="">

            <div class="name-plaque">
              <h1 class="artwork-title" id="galleryTitle"></h1>
            </div>
          </div>

          <figcaption>
            <p class="artwork-description" id="galleryDescription"></p>
          </figcaption>
        </figure>
        <button class="nav-button" id="next" type="button" aria-label="Next image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <p class="counter" id="counter" aria-live="polite"></p>
    </section>
  </main>

  <script src="gallery.js"></script>
</body>
</html>
